<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Machine in the loop</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="bar">
      <span class="dot" id="conn" data-state="connecting"></span>
      <span class="bar-label" id="conn-label">connecting</span>
      <span class="bar-spacer"></span>
      <button class="hint" id="alert-hint" type="button" hidden>tap to enable alerts</button>
      <span class="counter"><b id="completed">0</b> done</span>
      <span class="counter"><b id="pending">0</b> open</span>
    </header>

    <main id="stage">
      <section class="panel" id="panel-idle" hidden>
        <p class="idle-mark">—</p>
        <p class="idle-text">Standing by.</p>
        <p class="idle-sub">No open request. The controller has the floor.</p>
      </section>

      <section class="panel" id="panel-active" hidden>
        <p class="eyebrow">Request</p>
        <h1 class="directive" id="directive-text"></h1>
        <p class="note" id="directive-note" hidden></p>
        <p class="elapsed" id="elapsed"></p>

        <button class="done" id="done" type="button">Done</button>

        <ul class="upcoming" id="upcoming"></ul>
      </section>
    </main>

    <footer class="log" id="log-wrap" hidden>
      <button class="log-toggle" id="log-toggle" type="button">Completed</button>
      <ul id="log"></ul>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
