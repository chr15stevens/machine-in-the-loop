<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Machine in the loop">
  <title>Machine in the loop</title>
  <!-- the loop: an open cycle, arrowhead running clockwise -->
  <path d="M185.3 201.3A93 93 0 1 1 219.6 111.9" fill="none" stroke="#35d07f" stroke-width="15" stroke-linecap="round"/>
  <path d="M232.4 109.6 223.8 135.5 206.8 114.2Z" fill="#35d07f" stroke="#35d07f" stroke-width="8" stroke-linejoin="round"/>
  <!-- the machine, inside it -->
  <g fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <rect x="81" y="106" width="94" height="80" rx="23"/>
    <path d="M128 106V80"/>
  </g>
  <g fill="currentColor">
    <circle cx="128" cy="70" r="11"/>
    <circle cx="106" cy="142" r="10"/>
    <circle cx="150" cy="142" r="10"/>
    <rect x="109" y="164" width="38" height="9" rx="4.5"/>
  </g></svg>
